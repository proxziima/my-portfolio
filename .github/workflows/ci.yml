name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    # Secrets can't be read in a job-level `if`, so this job exports whether live evals can run.
    # The value is the boolean, never the secret.
    outputs:
      live-evals: ${{ secrets.OPENROUTER_API_KEY != '' }}
    services:
      postgres:
        image: postgres:17-alpine
        # twin_eval on 5433 is what apps/agents/fixtures/offline/.env.example points at.
        env: { POSTGRES_USER: twin, POSTGRES_PASSWORD: twin, POSTGRES_DB: twin_eval }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U twin -d twin_eval" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TWIN_DATABASE_URL: postgres://twin:twin@127.0.0.1:5433/twin_eval
      WORKFLOW_POSTGRES_URL: postgres://twin:twin@127.0.0.1:5433/twin_eval
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 }
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: bun install --frozen-lockfile
      - run: bunx turbo run check-types lint
      - run: bun run --cwd packages/twin test
      - run: bun run --cwd apps/agents test
      - name: payload integration tests (throwaway SQLite, never payload.db)
        env:
          DATABASE_URL: file:./.tmp/ci.db
          PAYLOAD_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-33
        run: bun run --cwd apps/payload test:int
      - run: bun run --cwd apps/web test
      # hash/manifest only: needs no ffmpeg or encoders, fails when a source or recipe changed without `assets:build`
      - run: bun run --cwd apps/web assets:check
      - run: bun test scripts/scan-client-bundle.test.ts
      - name: agent builds and discovers every capability
        run: bun run --cwd apps/agents info && bun run --cwd apps/agents build
      - name: offline acceptance evals (scripted model, local stubs)
        run: |
          bun run --cwd packages/twin db:migrate
          bun run --cwd apps/agents world:setup
          cd apps/agents/fixtures/offline && cp .env.example .env && bun run eval
      # Every web route that reads the CMS is force-dynamic, so `next build` never fetches it: CMS_URL
      # only has to parse. Page data is real at request time and nothing is stubbed.
      - name: client bundle carries no secrets or prompt fragments
        env: &web-env
          TWIN_JWT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-00
          TWIN_COOKIE_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-11
          TWIN_REDACT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-22
          TWIN_STABLE_KEY_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-33
          TWIN_BOOKING_REF_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-44
          IMESSAGE_PROJECT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-55
          IMESSAGE_WEBHOOK_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-88
          CAL_WEBHOOK_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-66
          PAYLOAD_MCP_API_KEY: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-77
          TWIN_PROMPT_CANARY: ci-canary-0123456789
          CMS_URL: http://127.0.0.1:3001
        run: bunx turbo run build --filter=web && bun scripts/scan-client-bundle.ts apps/web/.next/static

  # Lighthouse budgets on the production build of the letter, against a throwaway CMS seeded in this runner:
  # no secret is read and the real CMS is never touched. Budgets and how to update them: docs/observability.md,
  # "Performance budgets".
  lighthouse:
    needs: checks
    runs-on: ubuntu-latest
    env:
      # the same throwaway values as checks' bundle step; the CMS's own secret is generated below
      TWIN_JWT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-00
      TWIN_COOKIE_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-11
      TWIN_REDACT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-22
      TWIN_STABLE_KEY_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-33
      TWIN_BOOKING_REF_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-44
      IMESSAGE_PROJECT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-55
      IMESSAGE_WEBHOOK_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-88
      CAL_WEBHOOK_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-66
      PAYLOAD_MCP_API_KEY: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-77
      TWIN_PROMPT_CANARY: ci-canary-0123456789
      CMS_URL: http://127.0.0.1:3001
      SITE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 }
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: bun install --frozen-lockfile
      # the Lighthouse runner drives Playwright's Chromium, the browser every checkpoint was measured with
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - name: generate the cms secret
        run: |
          value=$(openssl rand -hex 32)
          echo "::add-mask::$value"
          echo "PAYLOAD_SECRET=$value" >> "$GITHUB_ENV"
      # NODE_ENV=production: the seed applies the committed migrations to the empty database (see live-evals)
      - name: throwaway cms (build, migrate, seed)
        env:
          DATABASE_URL: file:./.tmp/lighthouse.db
          NODE_ENV: production
          NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3001
        run: |
          mkdir -p apps/payload/.tmp
          bun run --cwd apps/payload build
          bun run --cwd apps/payload seed
      - name: start the cms
        env:
          DATABASE_URL: file:./.tmp/lighthouse.db
          NODE_ENV: production
          NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3001
        run: |
          nohup bun run --cwd apps/payload start > "$RUNNER_TEMP/cms.log" 2>&1 &
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:3001/api/globals/profile > /dev/null && exit 0
            sleep 2
          done
          tail -n 100 "$RUNNER_TEMP/cms.log"
          exit 1
      # the image's server: standalone carries neither static files nor public/, laid out as the Dockerfile does
      - name: build and start web
        run: |
          bunx turbo run build --filter=web
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public
          PORT=3100 HOSTNAME=127.0.0.1 nohup node apps/web/.next/standalone/apps/web/server.js > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:3100/ > /dev/null && exit 0
            sleep 2
          done
          tail -n 100 "$RUNNER_TEMP/web.log"
          exit 1
      - name: initial JS keeps posthog, three, eve and zod out, within budget; with the desk in its worker, no renderer or loader on the main thread
        working-directory: apps/web
        run: node scripts/perf/chunks.ts --url http://127.0.0.1:3100
      # Five runs per form factor with Lighthouse 13.5.0 (the checkpoints' version), CPU calibrated to
      # PageSpeed's hardware class from this runner's benchmark index, so budgets hold across runner types;
      # each assertion takes the median of the five.
      - name: lighthouse (mobile and desktop, 5 runs each)
        working-directory: apps/web
        run: node scripts/perf/lighthouse.ts --url http://127.0.0.1:3100/ --runs 5 --calibrate --lhci --out .perf/ci
      - name: budgets (mobile)
        working-directory: apps/web/.perf/ci/mobile
        run: bunx @lhci/cli@0.15.1 assert --config=../../../lighthouserc.mobile.json
      - name: budgets (desktop)
        if: success() || failure()
        working-directory: apps/web/.perf/ci/desktop
        run: bunx @lhci/cli@0.15.1 assert --config=../../../lighthouserc.desktop.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lighthouse, path: apps/web/.perf/ci, include-hidden-files: true }
      - name: service logs
        if: failure()
        run: |
          tail -n 200 "$RUNNER_TEMP/cms.log" || true
          tail -n 200 "$RUNNER_TEMP/web.log" || true

  # Live evals against a real model, with a throwaway CMS and agent inside this runner: production
  # agents are internal-only, so nothing outside the compose network can reach them. Spends model credit.
  live-evals:
    needs: checks
    if: >-
      needs.checks.outputs.live-evals == 'true' &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: twin, POSTGRES_PASSWORD: twin, POSTGRES_DB: twin_eval }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U twin -d twin_eval" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # The agent's env (agentsEnvSchema). Secrets shared with the CMS and the eval runner are
      # generated in the first step. Google is stubbed; iMessage is left unconfigured (it is optional), so
      # restricted entries are never offered and no approval runs.
      TWIN_DATABASE_URL: postgres://twin:twin@127.0.0.1:5433/twin_eval
      WORKFLOW_POSTGRES_URL: postgres://twin:twin@127.0.0.1:5433/twin_eval
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # web_search is not asserted by any live eval; a placeholder keeps the env valid without the secret.
      EXA_API_KEY: ${{ secrets.EXA_API_KEY || 'ci-no-exa-key' }}
      CMS_URL: http://127.0.0.1:3001
      PAYLOAD_MCP_URL: http://127.0.0.1:3001/api/mcp
      GOOGLE_SERVICE_ACCOUNT_JSON: eyJjbGllbnRfZW1haWwiOiJvZmZsaW5lQGV4YW1wbGUuY29tIiwicHJpdmF0ZV9rZXkiOiItLS0tLUJFR0lOIFBSSVZBVEUgS0VZLS0tLS1cbm9mZmxpbmVcbi0tLS0tRU5EIFBSSVZBVEUgS0VZLS0tLS1cbiJ9
      GOOGLE_CALENDAR_ID: ci@example.com
      OWNER_TIMEZONE: America/Sao_Paulo
      CAL_LINK: ci/intro
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 }
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: bun install --frozen-lockfile
      - name: generate throwaway secrets
        run: |
          for name in PAYLOAD_SECRET TWIN_REDACT_SECRET TWIN_JWT_SECRET TWIN_STABLE_KEY_SECRET CAL_WEBHOOK_SECRET TWIN_BOOKING_REF_SECRET; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          canary="canary-$(openssl rand -hex 16)"
          echo "::add-mask::$canary"
          echo "TWIN_PROMPT_CANARY=$canary" >> "$GITHUB_ENV"
      # NODE_ENV=production: the first Payload start (here, the seed) applies the committed migrations
      # (prodMigrations) to the empty database instead of pushing a dev schema.
      - name: throwaway cms (build, migrate, seed)
        env:
          DATABASE_URL: file:./.tmp/live.db
          NODE_ENV: production
          NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3001
        run: |
          mkdir -p apps/payload/.tmp
          bun run --cwd apps/payload build
          bun run --cwd apps/payload seed
          # Adds a public fact, a voice sample and the twin's MCP key (three tools only); writes
          # PAYLOAD_MCP_API_KEY to $GITHUB_ENV, masked.
          bun run --cwd apps/payload payload run src/seed/twin-ci.ts
      - name: start the cms
        env:
          DATABASE_URL: file:./.tmp/live.db
          NODE_ENV: production
          NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3001
        run: |
          nohup bun run --cwd apps/payload start > "$RUNNER_TEMP/cms.log" 2>&1 &
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:3001/api/globals/profile > /dev/null && exit 0
            sleep 2
          done
          tail -n 100 "$RUNNER_TEMP/cms.log"
          exit 1
      - name: build and start the agent
        run: |
          bun run --cwd apps/agents build
          bun run --cwd apps/agents world:setup
          bun run --cwd packages/twin db:migrate
          PORT=4100 nohup bun run --cwd apps/agents start > "$RUNNER_TEMP/agent.log" 2>&1 &
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:4100/eve/v1/health > /dev/null && exit 0
            sleep 2
          done
          tail -n 100 "$RUNNER_TEMP/agent.log"
          exit 1
      - name: live evals per skill and acceptance
        run: |
          token=$(bun apps/agents/scripts/mint-eval-token.ts)
          echo "::add-mask::$token"
          export EVE_EVAL_AUTH_TOKEN="$token"
          cd apps/agents && bunx eve eval --url http://127.0.0.1:4100 --strict --junit .eve/junit.xml
      - name: service logs
        if: failure()
        run: |
          tail -n 200 "$RUNNER_TEMP/cms.log" || true
          tail -n 200 "$RUNNER_TEMP/agent.log" || true
