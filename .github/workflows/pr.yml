name: pr
# pull_request_target runs with the base branch's workflow and config and never checks out PR code,
# so labels work on fork PRs without exposing the token to their code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write # creating the missing area:* labels goes through the issues API
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
