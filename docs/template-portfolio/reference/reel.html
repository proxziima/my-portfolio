<title>Reel Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;430;500;620;700&family=Caveat:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  /* ---------- palette lifted from the reference ---------- */
  :root{
    --paper:#FBFAF7; --ink:#171716; --ink-link:#292927; --ink-soft:#686863;
    --rule:#C4C4BE; --rule-soft:#E4E2DC; --chip:#EDEBE5;
    --glow-a:rgba(255,255,255,.76); --glow-b:rgba(176,142,91,.06); --glow-c:rgba(55,52,45,.035);
    --line3d:#3A3A34; --line3d-soft:#B9B7AE;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#141513; --ink:#F0EFEA; --ink-link:#E2E1DB; --ink-soft:#9A9A93;
      --rule:#3E3E38; --rule-soft:#2A2A26; --chip:#26261F;
      --glow-a:rgba(255,255,255,.035); --glow-b:rgba(176,142,91,.07); --glow-c:rgba(0,0,0,.25);
      --line3d:#D6D4CB; --line3d-soft:#4A4A43;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#141513; --ink:#F0EFEA; --ink-link:#E2E1DB; --ink-soft:#9A9A93;
    --rule:#3E3E38; --rule-soft:#2A2A26; --chip:#26261F;
    --glow-a:rgba(255,255,255,.035); --glow-b:rgba(176,142,91,.07); --glow-c:rgba(0,0,0,.25);
    --line3d:#D6D4CB; --line3d-soft:#4A4A43;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background-color:var(--paper); color:var(--ink);
    background-image:
      radial-gradient(1088px 608px at -8% -4%, var(--glow-a), rgba(0,0,0,0) 64%),
      radial-gradient(864px 992px at 108% 32%, var(--glow-b), rgba(0,0,0,0) 72%),
      radial-gradient(992px 672px at 18% 108%, var(--glow-c), rgba(0,0,0,0) 70%);
    background-attachment:fixed;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px; line-height:24px; -webkit-font-smoothing:antialiased;
  }
  main{max-width:632px; margin:0 auto; padding-inline:16px; padding-block:88px 108px; position:relative}  /* 600px of text, 16px gutters */
  @media (max-width:640px){ main{padding-block:56px 72px} }

  h1{margin:0; font-size:28px; line-height:1.22; font-weight:400; letter-spacing:-.012em}
  h1 .who{display:block; font-weight:620; color:var(--ink)}
  h1 .what{display:block; font-weight:430; color:var(--ink-soft)}
  @media (max-width:520px){ h1{font-size:24px} }

  .bio{display:grid; gap:16px; margin-top:28px; color:var(--ink-soft)}
  .bio p{margin:0}
  .bio strong{font-weight:500; color:var(--ink)}

  a.fav{color:var(--ink-link); text-decoration:none; white-space:nowrap}
  a.fav span{text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:2.7px; text-decoration-color:var(--rule)}
  a.fav:hover span{text-decoration-color:var(--ink-soft)}
  a.fav:focus-visible{outline:2px solid var(--ink-soft); outline-offset:2px; border-radius:2px}
  i.chip{
    display:inline-block; width:16px; height:16px; border-radius:3px; margin-right:4.5px; vertical-align:-3.2px;
    background:var(--chip); color:var(--ink-soft); font-style:normal; font-size:9.5px; line-height:16px;
    text-align:center; font-weight:600; letter-spacing:0;
  }

  .links{display:flex; flex-wrap:wrap; gap:6px 20px; margin-top:12px; font-size:15px}

  section{margin-top:64px}
  section h2{margin:0 0 24px; font-size:15px; font-weight:500; color:var(--ink-soft)}
  ol.list{list-style:none; margin:0; padding:0; display:grid; gap:14px}
  ol.list li{display:grid; grid-template-columns:1fr auto; gap:16px; align-items:start}
  .pos{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px}
  .pos .desc{color:var(--ink-soft)}
  .years{color:var(--ink-soft); font-variant-numeric:tabular-nums}
  @media (max-width:520px){ ol.list li{grid-template-columns:1fr} .years{font-size:14px} }

  /* ============ the reel: a 3D drum set into the headline ============ */
  h1 .what{display:flex; align-items:center; flex-wrap:wrap; min-height:40px}
  .reel{
    display:block; position:relative; height:36px; overflow:hidden; flex:0 0 auto;
    width:220px; border:0; padding:0; margin:0; background:none;
    cursor:pointer; touch-action:manipulation;
    transition:width .5s cubic-bezier(.16,.84,.26,1);
  }
  .reel canvas{position:absolute; left:0; top:0; height:100%; display:block}
  .reel::after{
    content:""; position:absolute; left:0; right:2px; bottom:2px; height:2px;
    background:var(--rule); opacity:.85;
    -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 10px);
    mask-image:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 10px);
  }
  .reel:hover::after, .reel:focus-visible::after{background:var(--ink-soft)}
  .reel:focus-visible{outline:2px solid var(--ink-soft); outline-offset:3px; border-radius:3px}
  .what .tail{white-space:pre; padding-left:9px}

  /* ============ word-level morph ============ */
  .w{display:inline-block; transition:opacity .28s ease, transform .34s cubic-bezier(.2,.8,.2,1), filter .28s ease}
  .w.out{opacity:0; transform:translateY(-.32em); filter:blur(2px)}
  .w.in{opacity:0; transform:translateY(.32em); filter:blur(2px)}

  /* ============ the plate ============ */
  .plate{margin:30px 0 0; touch-action:pan-y; cursor:grab}
  .plate:active{cursor:grabbing}
  .platebox{position:relative; height:216px}
  .plate canvas{display:block; width:100%; height:100%}
  .plate figcaption{margin-top:10px; font-size:11.5px; color:var(--ink-soft);
    opacity:.75; font-variant-numeric:tabular-nums}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

  /* ============ the wall switch (atlas-driven rocker) ============ */
  :root{ --wall-contact:#26221c5c; --wall-cast:#312c2421; }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --wall-contact:#00000085; --wall-cast:#00000038; } }
  :root[data-theme="dark"]{ --wall-contact:#00000085; --wall-cast:#00000038; }

  .theme-switcher{position:absolute; top:36px; right:-4px; width:2.8rem; height:3.7rem; z-index:9; user-select:none}
  @media (max-width:900px){ .theme-switcher{position:fixed; top:16px; right:16px} }
  .theme-wall-toggle{cursor:pointer; -webkit-tap-highlight-color:transparent; background:none; border:0;
    width:100%; height:100%; padding:0; display:block; position:absolute; inset:0}
  .theme-wall-toggle:focus-visible{outline:2px solid var(--ink-soft); outline-offset:4px; border-radius:6px}
  .theme-wall-stage{display:block; position:absolute; inset:0;
    filter:drop-shadow(0 .075rem .045rem var(--wall-contact)) drop-shadow(.025rem .24rem .22rem var(--wall-cast))}
  .theme-wall-image{object-fit:contain; pointer-events:none; width:100%; height:100%; display:block; position:absolute; inset:0}
  .theme-wall-state{transition:none}
  .theme-wall-state--light{opacity:1}
  .theme-wall-state--dark, :root[data-theme="dark"] .theme-wall-state--light{opacity:0}
  :root[data-theme="dark"] .theme-wall-state--dark{opacity:1}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .theme-wall-state--light{opacity:0}
    :root:not([data-theme="light"]) .theme-wall-state--dark{opacity:1}
  }
  .theme-wall-motion{visibility:hidden}
  .theme-wall-stage[data-motion-ready="true"] .theme-wall-motion{visibility:visible}
  .theme-wall-stage[data-motion-ready="true"] .theme-wall-state{visibility:hidden}
  :root[data-theme-transition] body, :root[data-theme-transition] .bio, :root[data-theme-transition] h1,
  :root[data-theme-transition] .who, :root[data-theme-transition] .what, :root[data-theme-transition] .tail,
  :root[data-theme-transition] .bio strong, :root[data-theme-transition] a.fav, :root[data-theme-transition] a.fav span,
  :root[data-theme-transition] i.chip, :root[data-theme-transition] .years, :root[data-theme-transition] .desc,
  :root[data-theme-transition] section h2, :root[data-theme-transition] figcaption, :root[data-theme-transition] .links a,
  :root[data-theme-transition] #wheel, :root[data-theme-transition] .sel, :root[data-theme-transition] .row .nm,
  :root[data-theme-transition] .row .mt, :root[data-theme-transition] .hint, :root[data-theme-transition] .reel::after{
    transition:background-color .38s ease, color .38s ease, border-color .38s ease, text-decoration-color .38s ease, box-shadow .38s ease}
  :root[data-theme-transition] .w{transition:opacity .28s ease, transform .34s cubic-bezier(.2,.8,.2,1), filter .28s ease, color .38s ease}

  /* ============ the blowout ============ */
  :root{ --flick:rgba(0,0,0,.28); }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --flick:rgba(255,236,200,.10); } }
  :root[data-theme="dark"]{ --flick:rgba(255,236,200,.10); }
  #flick{position:fixed; inset:0; z-index:96; pointer-events:none; background:var(--flick); opacity:0}
  :root[data-flicker] #flick{animation:boFlicker .42s steps(1,end) both}
  :root[data-flicker="1"] #flick{animation-duration:.5s}
  :root[data-flicker="3"] #flick, :root[data-flicker="4"] #flick{animation-name:boFlickerHard}
  @keyframes boFlicker{0%{opacity:0} 30%{opacity:.6} 42%{opacity:0} 70%{opacity:.35} 100%{opacity:0}}
  @keyframes boFlickerHard{0%{opacity:0} 12%{opacity:1} 22%{opacity:0} 38%{opacity:.8} 50%{opacity:0} 74%{opacity:.5} 100%{opacity:0}}
  .bo-flash{position:fixed; inset:0; z-index:98; pointer-events:none; opacity:0;
    background:radial-gradient(circle at var(--x) var(--y), rgba(255,246,222,1) 0, rgba(255,236,190,.92) 7%, rgba(255,228,168,0) 36%)}
  .bo-flash.in{animation:boFlash .55s ease-out both}
  @keyframes boFlash{0%{opacity:0} 6%{opacity:1} 30%{opacity:.5} 100%{opacity:0}}
  .bo-veil{position:fixed; inset:0; z-index:97; pointer-events:none; opacity:0;
    background:radial-gradient(circle at var(--x) var(--y), rgba(0,0,0,.30) 0, rgba(0,0,0,.82) 14%, rgba(0,0,0,.965) 42%, #000 72%);
    transition:opacity .9s cubic-bezier(.2,.7,.2,1)}
  .bo-veil.in{opacity:1}
  .bo-veil.out{opacity:0; transition-duration:.75s}
  :root[data-blackout] main > :not(.theme-switcher){filter:brightness(.5) saturate(.85); transition:filter .5s ease}
  .bo-fall{position:fixed; z-index:99; pointer-events:none; transform-origin:50% 50%; will-change:transform;
    filter:brightness(.72)}
  .bo-fall .theme-wall-toggle{position:absolute; inset:0}
  .bo-fall.out{opacity:0; transition:opacity .5s ease}
  .bo-puff{position:fixed; z-index:100; pointer-events:none; border-radius:50%; will-change:transform, opacity;
    background:radial-gradient(circle at 45% 42%, rgba(214,210,200,.95), rgba(190,186,176,.75) 45%, rgba(170,166,156,0) 72%)}
  .bo-shard{position:fixed; z-index:99; pointer-events:none; width:5px; height:5px; border-radius:1px; background:#E6E2D8; will-change:transform, opacity}
  @media (prefers-reduced-motion:reduce){ .bo-flash.in{animation:none; opacity:.6} .bo-veil{transition:none} }

  /* ============ the picker wheel: the role morphs into a short list ============ */
  .reelwrap{position:relative; display:flex; align-items:center}
  .reel{transition:width .5s cubic-bezier(.16,.84,.26,1), opacity .18s ease}
  .reelwrap.open .reel{opacity:.12}

  #wheel{
    position:absolute; left:-12px; top:50%; z-index:30;
    width:300px; margin-top:-63px; display:none;
    padding:0; border-radius:12px;
    background:var(--paper); border:1px solid var(--rule-soft);
    box-shadow:0 20px 40px -26px rgba(40,38,32,.6), 0 2px 5px -3px rgba(40,38,32,.22);
  }
  #wheel.on{display:block}
  #wheel.on .win{animation:wheelIn .26s cubic-bezier(.2,1.1,.3,1) both}
  @keyframes wheelIn{ from{opacity:0; transform:scaleY(.55)} to{opacity:1; transform:none} }
  .win{
    position:relative; height:126px; overflow:hidden; border-radius:12px;
    -webkit-mask-image:linear-gradient(transparent 0, #000 16%, #000 84%, transparent 100%);
    mask-image:linear-gradient(transparent 0, #000 16%, #000 84%, transparent 100%);
    cursor:ns-resize; touch-action:none;
  }
  .sel{                                   /* the slot the current role sits in */
    position:absolute; left:6px; right:6px; top:42px; height:42px; border-radius:8px;
    background:var(--chip); border:1px solid var(--rule-soft); pointer-events:none;
  }
  .rows{position:relative; will-change:transform}
  .row{
    height:42px; display:flex; align-items:center; gap:10px; padding:0 14px;
    cursor:pointer; user-select:none;
  }
  .row .nm{
    font-size:23px; font-weight:430; letter-spacing:-.012em; color:var(--ink-soft);
    white-space:nowrap; transition:color .2s ease, opacity .2s ease; opacity:.5;
  }
  .row .mt{
    margin-left:auto; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-soft); opacity:0; transition:opacity .2s ease;
  }
  .row.is-current .nm{color:var(--ink); opacity:1}
  .row.is-current .mt{opacity:.75}
  .row:hover .nm{opacity:.8}
  .hint{
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:6px 0 8px; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft); opacity:.55; border-top:1px solid var(--rule-soft);
  }
  @media (max-width:520px){ #wheel{width:260px} .row .nm{font-size:20px} }

  @media (prefers-reduced-motion:reduce){ #picker.on .pickinner{animation:none} }

  .card{
    position:relative; width:150px; padding:11px 11px 12px; text-align:left;
    border:1px solid var(--rule-soft); border-radius:10px; background:var(--chip);
    cursor:pointer; font:inherit; color:var(--ink);
    transition:transform .18s cubic-bezier(.2,1.2,.3,1), border-color .18s, background .18s;
  }
  .card:hover, .card:focus-visible{transform:translateY(-4px); border-color:var(--ink-soft); outline:none}
  .card[data-active="true"]{border-color:var(--ink-soft); transform:translateY(-4px)}
  .card .sig{display:block; width:100%; height:44px; margin-bottom:8px; color:var(--ink-soft)}
  .card[data-active="true"] .sig, .card:hover .sig{color:var(--ink)}
  .card .cls{display:block; font-size:12.5px; font-weight:620; letter-spacing:-.005em; line-height:1.25}
  .card .lv{display:block; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin-top:2px}
  .card .stat{display:flex; align-items:center; gap:6px; margin-top:5px; font-size:10px; color:var(--ink-soft)}
  .card .stat b{flex:0 0 62px; font-weight:400; letter-spacing:.03em; text-transform:uppercase}
  .pips{display:flex; gap:2px}
  .pips i{display:block; width:5px; height:8px; border-radius:1px; background:var(--rule-soft)}
  .pips i.f{background:var(--ink-soft)}
  .card[data-active="true"] .pips i.f, .card:hover .pips i.f{background:var(--ink)}
  .card .flav{display:block; margin-top:8px; padding-top:7px; border-top:1px solid var(--rule-soft);
    font-size:10.5px; line-height:1.4; color:var(--ink-soft)}
  .card .eq{display:inline-block; margin-top:6px; font-size:8.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft); border:1px solid var(--rule-soft); border-radius:99px; padding:1px 6px}
  .card[data-active="true"] .eq{color:var(--ink); border-color:var(--ink-soft)}

  @media (max-width:640px){
    #picker{position:fixed; left:8px !important; right:8px; top:auto !important; bottom:10px;
      transform:none !important; width:auto}
    .pickinner{overflow-x:auto; -webkit-overflow-scrolling:touch}
    .card{width:142px; flex:0 0 auto}
  }

  /* ============ curious mode ============ */
  :root{ --accent:#3155ff; --switch-track:#e4e1d9; --switch-border:#827e74; --switch-thumb:#fbfaf7; }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --accent:#8FA4FF; --switch-track:#2a2a26; --switch-border:#6b6b64; --switch-thumb:#e6e5df; } }
  :root[data-theme="dark"]{ --accent:#8FA4FF; --switch-track:#2a2a26; --switch-border:#6b6b64; --switch-thumb:#e6e5df; }

  .curiosity-trigger{
    appearance:none; background:none; border:0; padding:0; margin:0; color:inherit; font:inherit; cursor:pointer;
    display:inline-flex; align-items:center; gap:.35rem; vertical-align:baseline; -webkit-tap-highlight-color:transparent;
  }
  .curiosity-trigger:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:4px}
  .curiosity-word{cursor:inherit}
  .curiosity-switch-track{
    position:relative; flex:0 0 auto; width:1.625rem; height:1.125rem; border-radius:999px;
    border:1px solid var(--switch-border); background:var(--switch-track);
    transition:border-color .14s ease-out, background-color .14s ease-out;
  }
  .curiosity-switch-thumb{
    position:absolute; top:50%; left:.0625rem; width:.875rem; height:.875rem; border-radius:50%; z-index:1;
    border:1px solid var(--switch-border); background:var(--switch-thumb); transform:translateY(-50%);
    transition:transform .16s cubic-bezier(.16,1,.3,1);
  }
  .curiosity-trigger:hover .curiosity-switch-track{background:color-mix(in srgb, var(--switch-track) 92%, var(--ink))}
  .curiosity-trigger[aria-checked="true"] .curiosity-switch-track{border-color:var(--accent); background:var(--accent)}
  .curiosity-trigger[aria-checked="true"] .curiosity-switch-thumb{background:var(--paper); border:0; transform:translate(.5rem,-50%)}

  .curiosity-overlay{position:absolute; top:0; left:0; right:0; z-index:8; pointer-events:none; overflow:clip}
  .curiosity-guide{
    display:block; position:absolute; color:var(--accent); opacity:0; transform:translateY(4px);
    transition:opacity .22s cubic-bezier(.16,1,.3,1), transform .22s cubic-bezier(.16,1,.3,1);
  }
  .curiosity-overlay[data-visible="true"] .curiosity-guide{opacity:1; transform:translateY(0); transition-delay:var(--guide-delay,0s)}
  .curiosity-rail{border-left:1px dashed color-mix(in srgb, var(--accent) 42%, transparent)}
  .curiosity-width, .curiosity-section-guide{height:0; border-top:1px solid color-mix(in srgb, var(--accent) 46%, transparent)}
  .curiosity-width::before, .curiosity-width::after{content:""; position:absolute; top:-3px; width:1px; height:7px; background:currentColor}
  .curiosity-width::before{left:0} .curiosity-width::after{right:0}
  .curiosity-gap{width:0; border-left:1px solid color-mix(in srgb, var(--accent) 60%, transparent)}
  .curiosity-gap::before, .curiosity-gap::after{content:""; position:absolute; left:-3px; width:7px; height:1px; background:currentColor}
  .curiosity-gap::before{top:0} .curiosity-gap::after{bottom:0}
  .curiosity-label{
    position:absolute; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:10px; line-height:1;
    letter-spacing:.02em; color:var(--accent); background:var(--paper); padding:.12em .28em; white-space:nowrap;
  }
  .curiosity-width .curiosity-label{left:50%; top:-8.8px; transform:translateX(-50%)}
  .curiosity-section-guide .curiosity-label{left:8px; top:-6px; transform:translateY(-100%)}
  .curiosity-gap .curiosity-label{left:-8px; top:50%; transform:translate(-100%,-50%)}
  .curiosity-annotation{
    width:12.5rem; color:color-mix(in srgb, var(--ink-soft) 82%, var(--accent)); letter-spacing:.005em; white-space:pre-line;
    font-family:Caveat, "Segoe Print", cursive; font-size:1.25rem; font-weight:520; line-height:1.08;
    transform:translateY(4px) rotate(var(--note-rotation, 0deg));
  }
  .curiosity-overlay[data-visible="true"] .curiosity-annotation{transform:translateY(0) rotate(var(--note-rotation, 0deg))}
  .curiosity-annotation::before, .curiosity-annotation::after{content:""; position:absolute; top:.65em; height:1.5px;
    background:color-mix(in srgb, var(--accent) 58%, transparent)}
  .curiosity-annotation::before{width:1.1rem} .curiosity-annotation::after{width:.4rem; transform:rotate(68deg); transform-origin:50% center}
  .curiosity-annotation[data-side="right"]::before{right:calc(100% + .55rem)}
  .curiosity-annotation[data-side="right"]::after{right:calc(100% + 1.5rem)}
  .curiosity-annotation[data-side="left"]{text-align:right}
  .curiosity-annotation[data-side="left"]::before{left:calc(100% + .55rem)}
  .curiosity-annotation[data-side="left"]::after{left:calc(100% + 1.5rem)}
  .curiosity-annotation.formula{font-size:1.15rem; font-weight:600}
  .curiosity-annotation .fm{font-family:"Times New Roman", Georgia, serif; font-style:italic; font-size:1.02rem; font-weight:400;
    letter-spacing:0; display:block; margin-top:.15em; color:var(--accent)}
  @media (max-width:1040px){ .curiosity-annotation{display:none} }

  @media (prefers-reduced-motion:reduce){
    .w, .reel, .rocker{transition:none}
    #wheel.on .win{animation:none}
    .rows{transition:none !important}
  }
</style>

<div id="flick" aria-hidden="true"></div>
<div id="curiosity-overlay" class="curiosity-overlay" aria-hidden="true"></div>
<main>
  <div class="theme-switcher" id="switcher">
    <button class="theme-wall-toggle" id="wall" type="button" aria-label="Turn the lights off" aria-pressed="false">
      <span class="theme-wall-stage" id="wallstage" aria-hidden="true">

const TOKEN = /<a class="fav"[\s\S]*?<\/a>|<button class="curiosity-trigger"[\s\S]*?<\/button>|<strong>[\s\S]*?<\/strong>|[^\s]+/g;
/* keep each token together with the exact whitespace that followed it */
const splitStrong = h => h.replace(/<strong>([^<]*)<\/strong>/g,
  (m,inner)=> inner.trim().split(/\s+/).map(w=>'<strong>'+w+'</strong>').join(' '));
function tok(raw){
  const html = splitStrong(raw);
  const out=[]; let m, end=0;
  TOKEN.lastIndex = 0;
  while((m = TOKEN.exec(html))){
    if(out.length) out[out.length-1].sep = html.slice(end, m.index);
    out.push({t:m[0], sep:''});
    end = m.index + m[0].length;
  }
  return out;
}
function lcs(A,B){
  const a=A.map(x=>x.t), b=B.map(x=>x.t);
  const n=a.length, m=b.length, dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const keepA=new Set(), keepB=new Set(); let i=0,j=0;
  while(i<n && j<m){
    if(a[i]===b[j]){ keepA.add(i); keepB.add(j); i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]) i++; else j++;
  }
  return {keepA, keepB};
}
const wrap = (tokens, keep, cls) => tokens.map((tk,i)=>

const allOf = arr => new Set(arr.map((_,i)=>i));

function renderBio(bio, key){

function morphBio(nextKey){

  bio.dataset.role = nextKey;

    p.querySelectorAll('.w').forEach((s,i)=>{ if(plans[k] && !plans[k].keepA.has(i)) s.classList.add('out'); });
  });

const ATLAS = { src:'theme-switch/rocker-atlas.webp', frames:17, columns:5, width:212, height:280 };
const wall = document.getElementById('wall'), wallStage = document.getElementById('wallstage'),
      rockerC = document.getElementById('rockerc'), rockerX = rockerC.getContext('2d');
const atlas = new Image(); let motionReady = false, frameNow = isDark() ? 1 : 0, rockerRaf = 0, transT = 0;
function drawFrame(p){
  const n = Math.round(p * (ATLAS.frames - 1));
  rockerX.clearRect(0, 0, rockerC.width, rockerC.height);
  rockerX.drawImage(atlas, (n % ATLAS.columns) * ATLAS.width, Math.floor(n / ATLAS.columns) * ATLAS.height,
    ATLAS.width, ATLAS.height, 0, 0, rockerC.width, rockerC.height);
  frameNow = p;
}
let rockerTarget = frameNow, lastToggle = 0;
function rockerTo(target, rapid){
  /* a flip that is still running finishes instantly, so every click starts from a rested rocker */
  if(rockerRaf){ cancelAnimationFrame(rockerRaf); rockerRaf = 0; if(motionReady) drawFrame(rockerTarget); frameNow = rockerTarget; }
  rockerTarget = target;
  if(!motionReady || reduce || frameNow === target){ if(motionReady) drawFrame(target); frameNow = target; return; }
  const from = frameNow, start = performance.now();
  const dur = (rapid ? 115 : 200) * Math.abs(target - from);
  const tick = now => {
    const o = Math.max(0, Math.min(1, (now - start) / dur)), s = o * o * (3 - 2 * o);
    drawFrame(from + (target - from) * s);
    rockerRaf = o < 1 ? requestAnimationFrame(tick) : 0;
  };
  rockerRaf = requestAnimationFrame(tick);
}
atlas.decoding = 'async'; atlas.src = ATLAS.src;
(atlas.decode ? atlas.decode() : new Promise((res, rej)=>{ atlas.onload = res; atlas.onerror = rej; })).then(()=>{
  if(atlas.naturalWidth !== ATLAS.width * ATLAS.columns ||
     atlas.naturalHeight !== ATLAS.height * Math.ceil(ATLAS.frames / ATLAS.columns)) throw Error('atlas');
  motionReady = true; drawFrame(isDark() ? 1 : 0); wallStage.dataset.motionReady = 'true';
}).catch(()=>{ motionReady = false; });

let actx = null;
const AC = window.AudioContext || window.webkitAudioContext;
function audio(){ if(!AC) return null; actx = actx || new AC(); if(actx.state === 'suspended') actx.resume(); return actx; }
function clickSound(theme){
  try{
    const t = audio(); if(!t) return;
    const n = t.currentTime, r = .065;
    const buf = t.createBuffer(1, Math.ceil(t.sampleRate * r), t.sampleRate), a = buf.getChannelData(0);
    let o = 42;
    for(let e = 0; e < a.length; e++){
      o = o * 16807 % 2147483647;
      const w = o / 2147483647 * 2 - 1, s = e / t.sampleRate;
      a[e] = w * (Math.exp(-s * 132) + (s > .016 ? Math.exp(-(s - .016) * 220) * .52 : 0));
    }
    const src = t.createBufferSource(), bp = t.createBiquadFilter(), g = t.createGain();
    src.buffer = buf; bp.type = 'bandpass';
    const u = theme === 'light' ? 1450 : 1050;
    bp.frequency.setValueAtTime(u, n); bp.frequency.exponentialRampToValueAtTime(u * .74, n + r); bp.Q.setValueAtTime(.72, n);
    g.gain.setValueAtTime(1e-4, n);
    g.gain.exponentialRampToValueAtTime(theme === 'light' ? .115 : .105, n + .002);
    g.gain.exponentialRampToValueAtTime(1e-4, n + r);
    src.connect(bp).connect(g).connect(t.destination); src.start(n); src.stop(n + r);
  }catch(e){}
}

function themeTransition(){
  if(reduce) return;

}

}

/* the host may stamp its theme after load: keep the rocker on the right frame */
try{
  const settle = ()=>{ syncWall(); if(!rockerRaf && rockerTarget !== (isDark() ? 1 : 0)) rockerTo(isDark() ? 1 : 0); };
  new MutationObserver(settle).observe(root, {attributes:true, attributeFilter:['data-theme']});

}catch(e){}

/* =================== the blowout: flick the switch too fast and the bulb goes =================== */
const blowout = (function(){
  const clicks = []; let active = false;
  const WINDOW = 4000, NEEDED = 10, WARN = 6;

  function register(){
    const now = performance.now();
    clicks.push(now);
    while(clicks.length && now - clicks[0] > WINDOW) clicks.shift();
    if(active) return;
    if(clicks.length >= NEEDED){ clicks.length = 0; run(); return; }
    if(clicks.length >= 2) loadBulb();
    if(clicks.length >= WARN) flicker(clicks.length - WARN + 1);   /* the filament starts to complain */
  }
  let flickT = 0;
  function flicker(level){
    if(reduce) return;
    root.setAttribute('data-flicker', String(Math.min(4, level)));
    clearTimeout(flickT); flickT = setTimeout(()=> root.removeAttribute('data-flicker'), 420);
  }

  /* ---- sounds ---- */
  /* decoded once, played through the same context as the switch click */
  let bulbBuf = null, bulbLoading = null;
  function loadBulb(){
    const t = audio(); if(!t || bulbBuf || bulbLoading) return bulbLoading;
    bulbLoading = fetch(BULB_MP3).then(r=>r.arrayBuffer())
      .then(ab=>new Promise((res,rej)=>{ const p = t.decodeAudioData(ab, res, rej); if(p && p.then) p.then(res, rej); }))
      .then(buf=>{ bulbBuf = buf; }).catch(()=>{ bulbLoading = null; });
    return bulbLoading;
  }
  function pop(){
    try{
      const t = audio(); if(!t) return; const n = t.currentTime;
      if(bulbBuf){
        const s = t.createBufferSource(), g = t.createGain();
        s.buffer = bulbBuf; g.gain.value = .9;
        s.connect(g).connect(t.destination); s.start(n);
      } else {
        /* not decoded yet: the plain element still gets the sound out */
        try{ const a = new Audio(BULB_MP3); a.volume = .9; a.play().catch(()=>{}); }catch(e){}
      }
      /* a little low end under the sample */
      const o = t.createOscillator(), og = t.createGain(); o.type = 'sine';
      o.frequency.setValueAtTime(100, n); o.frequency.exponentialRampToValueAtTime(36, n + .26);
      og.gain.setValueAtTime(.32, n); og.gain.exponentialRampToValueAtTime(1e-4, n + .32);
      o.connect(og).connect(t.destination); o.start(n); o.stop(n + .34);
    }catch(e){}
  }
  function thud(v){
    try{
      const t = audio(); if(!t) return; const n = t.currentTime, r = .09;
      const buf = t.createBuffer(1, Math.ceil(t.sampleRate * r), t.sampleRate), a = buf.getChannelData(0);
      for(let i = 0; i < a.length; i++){ const s = i / t.sampleRate; a[i] = (Math.random() * 2 - 1) * Math.exp(-s * 60); }
      const src = t.createBufferSource(), lp = t.createBiquadFilter(), g = t.createGain();
      src.buffer = buf; lp.type = 'lowpass'; lp.frequency.value = 900;
      g.gain.setValueAtTime(.18 * v, n); g.gain.exponentialRampToValueAtTime(1e-4, n + r);
      src.connect(lp).connect(g).connect(t.destination); src.start(n); src.stop(n + r);
      const o = t.createOscillator(), og = t.createGain(); o.type = 'sine';
      o.frequency.setValueAtTime(95, n); o.frequency.exponentialRampToValueAtTime(50, n + .08);
      og.gain.setValueAtTime(.22 * v, n); og.gain.exponentialRampToValueAtTime(1e-4, n + .1);
      o.connect(og).connect(t.destination); o.start(n); o.stop(n + .11);
    }catch(e){}
  }

  function run(){
    active = true;
    const prevTheme = root.getAttribute('data-theme');
    const sw = document.getElementById('switcher');
    const r = sw.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;

    /* the bulb goes */
    pop();
    const flash = document.createElement('div'); flash.className = 'bo-flash';
    const veil = document.createElement('div'); veil.className = 'bo-veil';
    for(const el of [flash, veil]){ el.style.setProperty('--x', cx + 'px'); el.style.setProperty('--y', cy + 'px'); document.body.appendChild(el); }
    root.setAttribute('data-theme', 'dark'); root.setAttribute('data-blackout', '');
    syncWall(); hooks.repaint();
    requestAnimationFrame(()=>{ flash.classList.add('in'); veil.classList.add('in'); });

    /* the switch comes off the wall */
    const ghost = sw.cloneNode(true); ghost.removeAttribute('id'); ghost.className = 'bo-fall';
    ghost.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
    ghost.style.left = r.left + 'px'; ghost.style.top = r.top + 'px';
    ghost.style.width = r.width + 'px'; ghost.style.height = r.height + 'px';
    const gc = ghost.querySelector('canvas');
    if(gc && motionReady){ try{ gc.getContext('2d').drawImage(rockerC, 0, 0); }catch(e){} }
    document.body.appendChild(ghost);
    sw.style.opacity = '0'; sw.style.pointerEvents = 'none';

    /* shards */
    const shards = [];
    const NS = reduce ? 0 : 16;
    for(let i = 0; i < NS; i++){
      const s = document.createElement('div'); s.className = 'bo-shard';
      const sz = 3 + Math.random() * 5; s.style.width = sz + 'px'; s.style.height = sz * (0.6 + Math.random()) + 'px';
      document.body.appendChild(s);
      const a = Math.random() * Math.PI * 2, sp = 260 + Math.random() * 520;
      shards.push({ el:s, x:cx, y:cy, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - 260, ang:0, va:(Math.random() - .5) * 24, life:1 });
    }

    /* physics */
    const floor = innerHeight - r.height - 4;
    let x = r.left, y = r.top, vx = (Math.random() - .5) * 220, vy = -160, ang = 0, va = (Math.random() - .5) * 7;
    const g = 2700; let last = performance.now(); const stopAt = last + 3600;
    if(reduce){ vy = 0; ghost.style.transform = 'translate(0,' + (floor - r.top) + 'px) rotate(.35rad)'; }
    const step = now => {
      const dt = Math.min(.033, (now - last) / 1000); last = now;
      if(!reduce){
        vy += g * dt; x += vx * dt; y += vy * dt; ang += va * dt;
        if(x < 2){ x = 2; vx = Math.abs(vx) * .5; } if(x > innerWidth - r.width - 2){ x = innerWidth - r.width - 2; vx = -Math.abs(vx) * .5; }
        if(y >= floor){
          y = floor;
          if(Math.abs(vy) > 160){ vy = -vy * .34; vx *= .72; va = (Math.random() - .5) * 9 + va * .35; thud(Math.min(1, Math.abs(vy) / 800)); }
          else { vy = 0; vx *= .82; va *= .7; ang += (Math.round(ang / (Math.PI / 2)) * (Math.PI / 2) - ang) * .12; }
        }
        ghost.style.transform = 'translate(' + (x - r.left).toFixed(1) + 'px,' + (y - r.top).toFixed(1) + 'px) rotate(' + ang.toFixed(3) + 'rad)';
        for(const s of shards){
          s.vy += g * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.ang += s.va * dt;
          if(s.y > innerHeight - 4){ s.y = innerHeight - 4; s.vy = -s.vy * .3; s.vx *= .6; s.life -= .25; }
          s.life -= dt * .22;
          s.el.style.transform = 'translate(' + s.x + 'px,' + s.y + 'px) rotate(' + s.ang + 'rad)';
          s.el.style.opacity = Math.max(0, s.life);
        }
      }
      if(now < stopAt) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);

    /* the lights come back: a puff at the mount, the switch back inside it, then the room */
    setTimeout(()=>{
      ghost.classList.add('out');
      shards.forEach(s=>{ s.el.style.transition = 'opacity .4s'; s.el.style.opacity = 0; });
      poof();
      puff(cx, cy);
      /* the switch reappears inside the puff */
      sw.style.opacity = ''; sw.style.pointerEvents = '';
      sw.style.transformOrigin = '50% 50%';
      if(!reduce) sw.animate(
        [{transform:'scale(.45)', opacity:0}, {transform:'scale(1.09)', opacity:1, offset:.62}, {transform:'scale(1)', opacity:1}],
        {duration:420, delay:90, easing:'cubic-bezier(.2,1.1,.3,1)', fill:'backwards'});
      /* the theme is put back while the veil still hides the room… */
      setTimeout(()=>{
        root.removeAttribute('data-blackout');
        if(prevTheme) root.setAttribute('data-theme', prevTheme); else root.removeAttribute('data-theme');
        syncWall(); hooks.repaint(); rockerTo(isDark() ? 1 : 0, false);
      }, 160);
      /* …and the room comes back slowly */
      setTimeout(()=>{ veil.classList.remove('in'); veil.classList.add('out'); }, 520);
      setTimeout(()=>{
        veil.remove(); flash.remove(); ghost.remove(); shards.forEach(s=>s.el.remove());
        active = false;
      }, 1500);
    }, 3300);
  }

  /* a puff of smoke where the switch was */
  function puff(cx, cy){
    if(reduce) return;
    const N = 11;
    for(let i = 0; i < N; i++){
      const e = document.createElement('span'); e.className = 'bo-puff';
      const a = (i / N) * Math.PI * 2 + Math.random() * .6, d = 8 + Math.random() * 26;
      const size = 26 + Math.random() * 30;
      e.style.width = e.style.height = size + 'px';
      e.style.left = (cx - size/2) + 'px'; e.style.top = (cy - size/2) + 'px';
      document.body.appendChild(e);
      const dx = Math.cos(a) * d, dy = Math.sin(a) * d - 10;
      e.animate(
        [{transform:'translate(0,0) scale(.3)', opacity:0},
         {transform:'translate('+dx*.6+'px,'+dy*.6+'px) scale(1)', opacity:.85, offset:.18},
         {transform:'translate('+dx*1.6+'px,'+(dy*1.8 - 22)+'px) scale(1.7)', opacity:0}],
        {duration:720 + Math.random()*320, easing:'cubic-bezier(.16,.7,.3,1)', fill:'forwards'})
        .onfinish = ()=> e.remove();
    }
  }
  function poof(){
    try{
      const t = audio(); if(!t) return; const n = t.currentTime, r = .32;
      const buf = t.createBuffer(1, Math.ceil(t.sampleRate * r), t.sampleRate), a = buf.getChannelData(0);
      for(let i = 0; i < a.length; i++){ const s = i / t.sampleRate; a[i] = (Math.random()*2-1) * Math.pow(1 - s/r, 1.6) * (1 - Math.exp(-s*260)); }
      const src = t.createBufferSource(), lp = t.createBiquadFilter(), g = t.createGain();
      src.buffer = buf; lp.type = 'lowpass';
      lp.frequency.setValueAtTime(1600, n); lp.frequency.exponentialRampToValueAtTime(220, n + r);
      g.gain.setValueAtTime(.001, n); g.gain.exponentialRampToValueAtTime(.28, n + .02); g.gain.exponentialRampToValueAtTime(1e-4, n + r);
      src.connect(lp).connect(g).connect(t.destination); src.start(n); src.stop(n + r);
    }catch(e){}
  }
  return { register, get active(){ return active; }, get bulbReady(){ return !!bulbBuf; } };
})();

/* =================== the picker wheel: the role becomes a short list =================== */
(function(){
  const wrap = document.getElementById('reelwrap'), reel = document.getElementById('reel'),
        wheel = document.getElementById('wheel'), win = document.getElementById('win'),
        rowsEl = document.getElementById('rows');
  const ROW = 42;
  const META = { se:'LV 9 · backend', ai:'LV 4 · applied ml', civil:'LV 9 · structures' };
  const ITEMS = [...ORDER, ...ORDER, ...ORDER];          /* three copies, so the wheel never ends */
  let open = false, idx = 3, closeT = 0, suppress = false, acc = 0, cool = 0;

  function render(){
    rowsEl.innerHTML = ITEMS.map((k,i)=>
      '<div class="row" role="option" data-i="'+i+'" data-role="'+k+'" aria-selected="false">'+
        '<span class="nm">'+ROLES[k].reel+'</span><span class="mt">'+META[k]+'</span></div>').join('');
    mark();
  }
  function mark(){
    [...rowsEl.children].forEach((r,i)=>{
      const cur = i === idx;
      r.classList.toggle('is-current', cur);
      r.setAttribute('aria-selected', cur ? 'true' : 'false');
    });
  }
  function place(animate){
    rowsEl.style.transition = animate ? 'transform .28s cubic-bezier(.2,.9,.25,1)' : 'none';
    rowsEl.style.transform = 'translateY(' + (-(idx-1)*ROW) + 'px)';
  }
  function normalize(){
    if(idx < 3){ idx += 3; place(false); mark(); }
    else if(idx > 5){ idx -= 3; place(false); mark(); }
  }
  function goto(next, animate){
    idx = next; place(animate); mark();
    setRole(ORDER[((idx % 3) + 3) % 3]);
    setTimeout(normalize, animate ? 300 : 0);
  }
  const step = dir => goto(idx + dir, true);

  function show(){
    if(open || suppress) return;
    clearTimeout(closeT);
    idx = 3 + ORDER.indexOf(current);
    render(); place(false);
    wheel.classList.add('on'); wrap.classList.add('open');
    reel.setAttribute('aria-expanded','true');
    open = true;
  }
  function hide(){
    if(!open) return;
    open = false;
    wheel.classList.remove('on'); wrap.classList.remove('open');
    reel.setAttribute('aria-expanded','false');
  }
  const softHide = ()=>{ clearTimeout(closeT); closeT = setTimeout(hide, 160); };

  wrap.addEventListener('mouseenter', show);
  wrap.addEventListener('mouseleave', ()=>{ suppress = false; softHide(); });
  wheel.addEventListener('mouseenter', ()=> clearTimeout(closeT));
  reel.addEventListener('focus', show);
  wrap.addEventListener('focusout', e=>{ if(!wrap.contains(e.relatedTarget)) softHide(); });
  reel.addEventListener('click', ()=>{ if(open){ hide(); suppress = true; } else show(); });

  /* the wheel is driven by the wheel */
  win.addEventListener('wheel', e=>{
    e.preventDefault();
    const now = performance.now();
    acc += e.deltaY;
    if(now < cool || Math.abs(acc) < 26) return;
    step(acc > 0 ? 1 : -1);
    acc = 0; cool = now + 170;
  }, {passive:false});

  /* …and by a drag, for touch */
  let dragging = false, startY = 0, startIdx = 3;
  win.addEventListener('pointerdown', e=>{
    dragging = true; startY = e.clientY; startIdx = idx;
    try{ win.setPointerCapture(e.pointerId); }catch(err){}
  });
  win.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const next = startIdx + Math.round((startY - e.clientY)/ROW);
    if(next !== idx) goto(next, true);
  });
  const endDrag = ()=>{ dragging = false; };
  win.addEventListener('pointerup', endDrag);
  win.addEventListener('pointercancel', endDrag);

  win.addEventListener('click', e=>{
    const row = e.target.closest('.row'); if(!row || dragging) return;
    const i = +row.dataset.i;
    if(i === idx) hide(); else goto(i, true);
  });

  reel.addEventListener('keydown', e=>{
    if(e.key === 'ArrowDown' || e.key === 'ArrowRight'){ e.preventDefault(); show(); step(1); }
    else if(e.key === 'ArrowUp' || e.key === 'ArrowLeft'){ e.preventDefault(); show(); step(-1); }
    else if(e.key === 'Escape'){ hide(); }
  });
  document.addEventListener('click', e=>{ if(open && !wrap.contains(e.target)) hide(); });
  render();
})();

(function(){

    return;
  }

  /* ---------- the reel: a 3-sided drum set into the headline ---------- */
  const reelEl = document.getElementById('reel'), reelCanvas = document.getElementById('reelc');
  const RH = 36, RW = 340, DPR = Math.min(devicePixelRatio||1, 2);

  const drum = new THREE.Group(); rScene.add(drum);
  const R = RH/(2*Math.sqrt(3));
  const faces = ORDER.map((key,i)=>{
    const cv = document.createElement('canvas');
    cv.width = Math.round(RW*DPR*2); cv.height = Math.round(RH*DPR*2);
    const tex = new THREE.CanvasTexture(cv);
    tex.anisotropy = 8; tex.minFilter = THREE.LinearFilter;
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(RW, RH),
      new THREE.MeshBasicMaterial({map:tex, transparent:true, side:THREE.FrontSide, depthWrite:false}));
    const a = i*Math.PI*2/3;
    mesh.position.set(0, R*Math.sin(a), R*Math.cos(a));
    mesh.rotation.x = -a;
    drum.add(mesh);
    return {cv, tex, mesh, key, width:RW};
  });
  function paintReel(colour){
    const col = colour || getComputedStyle(document.body).getPropertyValue('--ink-soft').trim() || '#686863';
    faces.forEach(f=>{
      const g = f.cv.getContext('2d'), s = DPR*2;
      g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,f.cv.width,f.cv.height); g.scale(s,s);
      g.font = '430 28px Inter, sans-serif'; g.fillStyle = col;
      g.textBaseline = 'middle'; g.textAlign = 'left';
      g.fillText(ROLES[f.key].reel, 1, RH/2 + 1);
      f.width = Math.ceil(g.measureText(ROLES[f.key].reel).width) + 4;
      f.tex.needsUpdate = true;
    });
    sizeReel();
  }
  function sizeReel(){ reelEl.style.width = Math.min(faces[ORDER.indexOf(current)].width, RW)+'px'; }

  let spinNow = 0, spinTarget = 0;
  function reelTo(key){
    const want = ORDER.indexOf(key)*Math.PI*2/3;
    const d = ((want - spinTarget + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI;
    spinTarget += d; if(reduce) spinNow = spinTarget; sizeReel();
  }
  /* the drum only ever displays the class the page is in; the picker changes it */
  function faceIndex(){ return ((Math.round(spinNow/(Math.PI*2/3)) % 3) + 3) % 3; }

  /* ================= the plate: three drawings, one morph ================= */
  const plate = document.getElementById('plate'), platebox = document.getElementById('platebox'),
        plateCanvas = document.getElementById('platec');
  const pScene = new THREE.Scene();
  const pCam = new THREE.PerspectiveCamera(32, 3, .1, 100);
  const pRenderer = new THREE.WebGLRenderer({canvas:plateCanvas, alpha:true, antialias:true});
  pRenderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  const world = new THREE.Group(); pScene.add(world);

  const S = (x0,y0,z0,x1,y1,z1) => [x0,y0,z0,x1,y1,z1];
  function boxEdges(cx,cy,cz,w,h,d){
    const X=w/2,Y=h/2,Z=d/2, c=[[-X,-Y,-Z],[X,-Y,-Z],[X,Y,-Z],[-X,Y,-Z],[-X,-Y,Z],[X,-Y,Z],[X,Y,Z],[-X,Y,Z]];
    return [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]]
      .map(e=>S(cx+c[e[0]][0],cy+c[e[0]][1],cz+c[e[0]][2], cx+c[e[1]][0],cy+c[e[1]][1],cz+c[e[1]][2]));
  }

  /* ---- shared drawing helpers ---- */
  function ring(cx,cy,cz, rx, rz, n, s, axis){          /* an ellipse; axis 'y' lies flat, 'x' stands on its side */
    for(let i=0;i<n;i++){ const a0=i/n*Math.PI*2, a1=(i+1)/n*Math.PI*2;
      if(axis === 'x') s.push(S(cx, cy+Math.cos(a0)*rx, cz+Math.sin(a0)*rz, cx, cy+Math.cos(a1)*rx, cz+Math.sin(a1)*rz));
      else if(axis === 'z') s.push(S(cx+Math.cos(a0)*rx, cy+Math.sin(a0)*rz, cz, cx+Math.cos(a1)*rx, cy+Math.sin(a1)*rz, cz));
      else s.push(S(cx+Math.cos(a0)*rx, cy, cz+Math.sin(a0)*rz, cx+Math.cos(a1)*rx, cy, cz+Math.sin(a1)*rz)); }
  }
  function dbDrum(cx,cy,cz, r, h, s){                       /* a database: stacked discs */
    for(const yy of [h/2, h/6, -h/6, -h/2]) ring(cx, cy+yy, cz, r, r*.55, 22, s, 'y');
    for(const a of [0, Math.PI/2, Math.PI, Math.PI*1.5]) s.push(S(cx+Math.cos(a)*r, cy-h/2, cz+Math.sin(a)*r*.55, cx+Math.cos(a)*r, cy+h/2, cz+Math.sin(a)*r*.55));
  }

      if(hex !== reelHex){ reelHex = hex; paintReel(hex); }
      const near = (a,b) => Math.abs(a.r-b.r)+Math.abs(a.g-b.g)+Math.abs(a.b-b.b) < .004;
      if(near(pMat.color, lineTarget) && near(reelNow, reelTarget)){
        pMat.color.copy(lineTarget); flowMat.color.copy(lineTarget); reelNow.copy(reelTarget);
        const hex = '#' + reelNow.getHexString(); if(hex !== reelHex){ reelHex = hex; paintReel(hex); }
        colourSettled = true;
      }
    }
    spinNow += (spinTarget - spinNow) * Math.min(1, dt*9);
    if(Math.abs(spinTarget - spinNow) < .0015 && faceIndex() !== ORDER.indexOf(current)) reelTo(current);
    drum.rotation.x = spinNow;
    rRenderer.render(rScene, rCam);

    if(pT < 1){
      pT = Math.min(1, pT + dt*1.15);
      for(let i=0;i<SEG;i++){
        const p = easeOut(Math.min(1, Math.max(0,(pT - pDelay[i])/.6)));
        for(let v=0; v<6; v++){ const k=i*6+v; pPos[k] = pFrom[k] + (pTo[k]-pFrom[k])*p; }
      }
      pGeo.attributes.position.needsUpdate = true;
    }
    for(const k of ORDER){ const m = annMeshes[k], want = (annotOn && k === current && pT > .85) ? .9 : 0;
      m.material.color.lerp(annTarget, Math.min(1, dt*8));
      m.material.opacity += (want - m.material.opacity) * Math.min(1, dt*6);
      m.visible = m.material.opacity > .01; }
    if(!reduce) stepFlow(current, dt);
    truckT += dt*.11; if(truckT>1) truckT -= 1;
    truck.position.set(-L/2-.9 + truckT*(L+1.8), -Math.sin(truckT*Math.PI)*.05, 0);
    truckMat.color.copy(pMat.color);
    truckMat.opacity += (((current==='civil' && pT>.85) ? .9 : 0) - truckMat.opacity) * Math.min(1, dt*4);
    truck.visible = truckMat.opacity > .01;
    flowMat.opacity += ((pT>.85 ? .85 : 0) - flowMat.opacity) * Math.min(1, dt*3.4);

    tiltX += (aimX-tiltX)*.07; tiltY += (aimY-tiltY)*.07;
    world.rotation.x = tiltX;
    world.rotation.y = tiltY + spin + (reduce?0:Math.sin(clock*.2)*.07);
    pRenderer.render(pScene, pCam);
    requestAnimationFrame(frame);
  })(performance.now());
})();
</script>
